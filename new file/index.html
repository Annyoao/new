<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>專案甘特圖 v3（拖拉區間版）</title>
<style>
body { font-family: Arial; margin: 20px; }
.controls { margin-bottom: 10px; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ccc; padding: 4px; text-align: center; position: relative; }
th { background: #f4f4f4; }
.task-cell { text-align: left; cursor: grab; }
.timeline-cell { height: 28px; }
.bar {
  position: absolute;
  height: 18px;
  border-radius: 4px;
  top: 4px;
  cursor: move;
}
.handle {
  position: absolute;
  width: 6px;
  top: 0;
  bottom: 0;
  cursor: ew-resize;
}
.handle.left { left: 0; }
.handle.right { right: 0; }
.dev { background: #4caf50; }
.design { background: #2196f3; }
.test { background: #ff9800; }
</style>
</head>
<body>

<h2>專案甘特圖（拖拉時間軸版）</h2>

<div class="controls">
  月份：
  <select id="monthSelect" onchange="changeMonth()">
    <option value="4">4月</option>
    <option value="5">5月</option>
    <option value="6">6月</option>
  </select>

  指派人員：
  <select id="picList">
    <option>王小明</option>
    <option>李小華</option>
    <option>張小美</option>
  </select>

  類型：
  <select id="typeList">
    <option value="dev">開發</option>
    <option value="design">設計</option>
    <option value="test">測試</option>
  </select>

  <button onclick="addTask()">新增任務</button>
</div>

<table id="gantt">
<thead>
<tr>
<th>任務</th>
<th>PIC</th>
<th>類型</th>
<th id="dateHeader"></th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let data = JSON.parse(localStorage.getItem('ganttData') || '{}');
let currentMonth = document.getElementById('monthSelect').value;
let dragType = null; // move | resize-left | resize-right
let dragIndex = null;

function daysInMonth(month) {
  return new Date(2026, month, 0).getDate();
}

function save() {
  localStorage.setItem('ganttData', JSON.stringify(data));
}

function renderHeader() {
  const header = document.getElementById('dateHeader');
  let days = daysInMonth(currentMonth);
  let html = '';
  for (let i = 1; i <= days; i++) {
    html += `<span style="display:inline-block;width:30px">${i}</span>`;
  }
  header.innerHTML = html;
}

function render() {
  renderHeader();
  const tbody = document.querySelector('#gantt tbody');
  tbody.innerHTML = '';

  const monthData = data[currentMonth] || [];
  const days = daysInMonth(currentMonth);

  monthData.forEach((task, i) => {
    const row = document.createElement('tr');

    let timeline = document.createElement('td');
    timeline.colSpan = days;
    timeline.className = 'timeline-cell';

    let bar = document.createElement('div');
    bar.className = `bar ${task.type}`;

    let left = (task.start - 1) * 30;
    let width = (task.end - task.start + 1) * 30;

    bar.style.left = left + 'px';
    bar.style.width = width + 'px';

    // 中間拖曳
    bar.onmousedown = (e) => {
      dragType = 'move';
      dragIndex = i;
      startX = e.clientX;
      originalStart = task.start;
      document.onmousemove = onDrag;
      document.onmouseup = stopDrag;
    };

    // 左拉
    let leftHandle = document.createElement('div');
    leftHandle.className = 'handle left';
    leftHandle.onmousedown = (e) => {
      e.stopPropagation();
      dragType = 'resize-left';
      dragIndex = i;
      startX = e.clientX;
      originalStart = task.start;
      document.onmousemove = onDrag;
      document.onmouseup = stopDrag;
    };

    // 右拉
    let rightHandle = document.createElement('div');
    rightHandle.className = 'handle right';
    rightHandle.onmousedown = (e) => {
      e.stopPropagation();
      dragType = 'resize-right';
      dragIndex = i;
      startX = e.clientX;
      originalEnd = task.end;
      document.onmousemove = onDrag;
      document.onmouseup = stopDrag;
    };

    bar.appendChild(leftHandle);
    bar.appendChild(rightHandle);
    timeline.appendChild(bar);

    row.innerHTML = `
      <td class="task-cell">${task.name}</td>
      <td>${task.pic}</td>
      <td>${task.type}</td>
    `;

    row.appendChild(timeline);
    tbody.appendChild(row);
  });
}

let startX, originalStart, originalEnd;

function onDrag(e) {
  let dx = e.clientX - startX;
  let moveDays = Math.round(dx / 30);
  let task = data[currentMonth][dragIndex];
  let maxDays = daysInMonth(currentMonth);

  if (dragType === 'move') {
    let duration = task.end - task.start;
    let newStart = Math.max(1, Math.min(originalStart + moveDays, maxDays - duration));
    task.start = newStart;
    task.end = newStart + duration;
  }

  if (dragType === 'resize-left') {
    let newStart = Math.max(1, Math.min(originalStart + moveDays, task.end));
    task.start = newStart;
  }

  if (dragType === 'resize-right') {
    let newEnd = Math.min(maxDays, Math.max(originalEnd + moveDays, task.start));
    task.end = newEnd;
  }

  render();
}

function stopDrag() {
  save();
  document.onmousemove = null;
  document.onmouseup = null;
}

function addTask() {
  if (!data[currentMonth]) data[currentMonth] = [];

  data[currentMonth].push({
    name: '新任務',
    pic: document.getElementById('picList').value,
    type: document.getElementById('typeList').value,
    start: 1,
    end: 3
  });

  save();
  render();
}

function changeMonth() {
  currentMonth = document.getElementById('monthSelect').value;
  render();
}

render();
</script>

</body>
</html>
